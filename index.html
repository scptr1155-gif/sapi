
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCP Key Generator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:radial-gradient(circle at top,#172c50,#080d18 65%);
 color:white;font-family:Arial,sans-serif;padding:20px
}
.panel{
 width:100%;max-width:390px;padding:32px 25px;
 background:#101a2b;border:1px solid #263b5b;
 border-radius:20px;text-align:center;
 box-shadow:0 20px 70px #0008
}
.logo{font-size:42px;margin-bottom:12px}
h1{font-size:25px;margin:8px}
p{color:#9cacc4;font-size:14px;line-height:1.6}
button{
 width:100%;padding:15px;border:0;border-radius:10px;
 background:#2675ed;color:white;font-size:15px;
 font-weight:bold;cursor:pointer;margin-top:15px
}
button:hover{background:#3988ff}
button:disabled{opacity:.5;cursor:wait}
.timer{font-size:38px;font-weight:bold;margin:25px;color:#64a4ff}
.key{
 background:#091321;border:1px dashed #3988ff;
 border-radius:10px;padding:16px;overflow-wrap:anywhere;
 margin-top:18px;color:#76b2ff;font-weight:bold
}
.hidden{display:none}
.status{font-size:13px;color:#7f91ad;margin-top:18px}
</style>
</head>
<body>
<div class="panel">
 <div class="logo">🔑</div>
 <h1>SCP KEY GENERATOR</h1>
 <p>24 saat geçerli özel erişim anahtarını oluştur.</p>

 <button id="generate" onclick="start()">KEY ÜRET</button>

 <div id="waiting" class="hidden">
  <p>Discord'a yönlendirildin. Geri sayım başladı.</p>
  <div class="timer" id="timer">30</div>
  <p>Key hazırlanıyor...</p>
 </div>

 <div id="result" class="hidden">
  <p>Key başarıyla oluşturuldu!</p>
  <div class="key" id="key"></div>
  <button onclick="copyKey()">KEY KOPYALA</button>
  <p>Geçerlilik: 24 saat</p>
 </div>

 <div class="status" id="status">Sistem hazır.</div>
</div>

<script>
let generatedKey="";

async function start(){
 const button=document.getElementById("generate");
 button.disabled=true;
 document.getElementById("waiting").classList.remove("hidden");
 document.getElementById("status").textContent="Discord bağlantısı açıldı.";

 window.open("https://discord.gg/nnZvv63jSy","_blank");

 let remaining=30;
 document.getElementById("timer").textContent=remaining;

 const countdown=setInterval(async()=>{
  remaining--;
  document.getElementById("timer").textContent=remaining;

  if(remaining<=0){
   clearInterval(countdown);
   document.getElementById("status").textContent="Key oluşturuluyor...";

   try{
    const response=await fetch("/api/generate",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({})
    });
    const data=await response.json();

    if(!response.ok) throw new Error(data.error||"İşlem başarısız");

    generatedKey=data.key;
    document.getElementById("key").textContent=generatedKey;
    document.getElementById("result").classList.remove("hidden");
    document.getElementById("waiting").classList.add("hidden");
    document.getElementById("status").textContent="Key hazır.";
   }catch(error){
    document.getElementById("status").textContent=error.message;
    button.disabled=false;
    button.textContent="TEKRAR DENE";
    document.getElementById("waiting").classList.add("hidden");
   }
  }
 },1000);
}

async function copyKey(){
 await navigator.clipboard.writeText(generatedKey);
 document.getElementById("status").textContent="Key kopyalandı!";
}
</script>
</body>
</html>
