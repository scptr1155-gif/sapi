<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCP Key Generator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;background:radial-gradient(circle at top,#19375f,#080d18 70%);
 color:white;font-family:Arial,sans-serif
}
.panel{
 width:100%;max-width:410px;background:#111c2e;
 border:1px solid #293d5d;border-radius:20px;
 padding:30px 25px;text-align:center;
 box-shadow:0 20px 70px #0008
}
.logo{font-size:48px}
h1{font-size:23px}
p{font-size:14px;color:#9eacc2;line-height:1.6}
button{
 width:100%;padding:15px;margin-top:15px;
 border:0;border-radius:10px;background:#2675ed;
 color:white;font-weight:bold;font-size:15px;cursor:pointer
}
button:disabled{opacity:.5;cursor:wait}
.timer{font-size:46px;color:#62a5ff;font-weight:bold;margin:25px}
.key{
 padding:16px;background:#091321;border:1px dashed #3988ff;
 border-radius:10px;color:#78b5ff;overflow-wrap:anywhere;user-select:all
}
.hidden{display:none}
.status{font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="panel">
 <div class="logo">🔑</div>
 <h1>SCP KEY GENERATOR</h1>
 <p>24 saat geçerli erişim anahtarını oluştur.</p>

 <button id="generate" onclick="start()">KEY ÜRET</button>

 <div id="waiting" class="hidden">
  <p>Discord daveti açıldı. Bekleme süresi:</p>
  <div class="timer" id="timer">30</div>
  <p>Key hazırlanıyor...</p>
 </div>

 <div id="result" class="hidden">
  <p>Key başarıyla oluşturuldu!</p>
  <div class="key" id="key"></div>
  <button onclick="copyKey()">KEY KOPYALA</button>
  <p>Geçerlilik: 24 saat. Yeni keyin aktif olması birkaç dakika sürebilir.</p>
 </div>

 <div class="status" id="status">Sistem hazır.</div>
</div>

<script>
const $ = id => document.getElementById(id);
let busy=false;
let generatedKey="";

async function api(url,body={}){
 const response=await fetch(url,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(body)
 });

 const raw=await response.text();
 let data;

 try{
  data=JSON.parse(raw);
 }catch{
  throw new Error("Sunucu cevabı geçersiz: "+raw.slice(0,100));
 }

 if(!response.ok) throw new Error(data.error||"HTTP "+response.status);
 return data;
}

async function start(){
 if(busy)return;
 busy=true;
 $("generate").disabled=true;
 $("waiting").classList.remove("hidden");
 $("result").classList.add("hidden");   // eski key gizlenir, yenisi uretilecek
 $("status").textContent="İşlem başlatılıyor...";

 // Açılır pencere engelini azaltmak için tıklama anında aç.
 window.open("https://discord.gg/nnZvv63jSy","_blank");

 try{
  const data=await api("/api/start");
  const challenge=data.challenge;

  // Sayac saate gore hesaplanir: sekme arka planda olsa bile sapmaz.
  const end=Date.now()+(data.waitMs||30000);
  $("timer").textContent=Math.ceil((end-Date.now())/1000);
  $("status").textContent="Geri sayım başladı.";

  const interval=setInterval(async()=>{
   const left=Math.max(0,Math.ceil((end-Date.now())/1000));
   $("timer").textContent=left;
   if(left>0)return;

   clearInterval(interval);

   try{
    $("status").textContent="GitHub'a kaydediliyor...";
    const result=await api("/api/generate",{challenge});

    generatedKey=result.key;
    $("key").textContent=generatedKey;
    $("waiting").classList.add("hidden");
    $("result").classList.remove("hidden");
    $("status").textContent="Key hazır. 24 saat geçerli.";
    $("generate").textContent="YENİ KEY ÜRET";
   }catch(error){
    $("waiting").classList.add("hidden");
    $("status").textContent=error.message;
    $("generate").textContent="TEKRAR DENE";
   }

   $("generate").disabled=false;
   busy=false;
  },250);

 }catch(error){
  $("waiting").classList.add("hidden");
  $("status").textContent=error.message;
  $("generate").disabled=false;
  $("generate").textContent="TEKRAR DENE";
  busy=false;
 }
}

async function copyKey(){
 try{
  await navigator.clipboard.writeText(generatedKey);
  $("status").textContent="Key kopyalandı!";
 }catch{
  $("status").textContent="Key'i elle kopyalayabilirsin.";
 }
}
</script>
</body>
</html>
